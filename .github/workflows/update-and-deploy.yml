name: Update data & deploy

# Runs on every push to main. If new downloads were added to data/incoming/,
# it cleans them, rebuilds data/attributes.json, commits the result, and then
# publishes the site to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild data/attributes.json from data/source even if nothing new was uploaded"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the rebuilt data back to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for new downloads
        id: incoming
        env:
          REBUILD: ${{ inputs.rebuild }}
        run: |
          if ls data/incoming/*.xlsx data/incoming/*.csv data/incoming/*.XLSX data/incoming/*.CSV >/dev/null 2>&1 \
             || [ "$REBUILD" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.incoming.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Clean data & rebuild
        if: steps.incoming.outputs.run == 'true'
        run: |
          pip install "pandas==2.2.3" "openpyxl==3.1.5"
          python scripts/build_data.py

      - name: Commit rebuilt data
        if: steps.incoming.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "Rebuild land attribute data from new downloads"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r assets _site/
          cp data/attributes.json data/geo_index.json data/parcels.geojson _site/data/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the site
      id-token: write # required by deploy-pages
      actions: read # deploy-pages looks up this run's uploaded site bundle
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
